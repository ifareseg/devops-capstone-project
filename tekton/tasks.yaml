apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: echo
spec:
  description: This task will echo the message.
  params:
    - name: message
      description: The message to echo
      type: string
  steps:
    - name: echo-message
      image: alpine:3
      command:
        - /bin/echo
      args:
        - $(params.message)

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: This task will clean up a workspace by deleting all of the files.
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/usr/bin/env sh
        set -eu
        echo "Removing all files from ${WORKSPACE_SOURCE_PATH} ..."
        if [ -d "${WORKSPACE_SOURCE_PATH}" ] ; then
          rm -rf "${WORKSPACE_SOURCE_PATH:?}"/*
          rm -rf "${WORKSPACE_SOURCE_PATH}"/.[!.]*
          rm -rf "${WORKSPACE_SOURCE_PATH}"/..?*
        fi

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose-tests
spec:
  description: Run unit tests with nosetests
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: sqlite:///test.db
      script: |
        #!/bin/sh
        set -eu
        pip install --upgrade pip wheel
        pip install -r requirements.txt
        nosetests

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: flake8
spec:
  description: Run flake8 lint checks
  params:
    - name: package
      type: string
      default: service
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install --upgrade pip wheel
        pip install -r requirements.txt
        flake8 $(params.package) --count --max-complexity=10 --max-line-length=127 --statistics

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  description: Clone a git repository into the workspace
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
    - name: deleteExisting
      type: string
      default: "true"
  workspaces:
    - name: output
  steps:
    - name: clone
      image: alpine/git:latest
      workingDir: $(workspaces.output.path)
      script: |
        #!/bin/sh
        set -eu
        if [ "$(params.deleteExisting)" = "true" ]; then
          rm -rf ./* ./.git || true
        fi
        git clone $(params.url) .
        git checkout $(params.revision)

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kubernetes-deploy
spec:
  description: Deploy manifests to Kubernetes/OpenShift
  params:
    - name: manifest-dir
      type: string
      default: k8s
    - name: image-reference
      type: string
  workspaces:
    - name: source
  steps:
    - name: apply-manifests
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu

        echo "Updating deployment image to $(params.image-reference)"

        rm -rf /tmp/manifests
        mkdir -p /tmp/manifests
        cp -R $(params.manifest-dir)/* /tmp/manifests/

        sed -i "s|image: .*|image: $(params.image-reference)|" /tmp/manifests/deployment.yaml

        echo "Applying Kubernetes manifests"
        kubectl apply -f /tmp/manifests/postgres.yaml
        kubectl apply -f /tmp/manifests/postgres-service.yaml
        kubectl apply -f /tmp/manifests/deployment.yaml
        kubectl apply -f /tmp/manifests/service.yaml

        if [ -f /tmp/manifests/route.yaml ]; then
          kubectl apply -f /tmp/manifests/route.yaml || true
        fi